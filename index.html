<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Chat</title>

<style>
body{
    margin:0;
    font-family:tahoma;
    background:#020617;
    color:white;
    height:100vh;
}
.login, .chat{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
.box{
    width:90%;
    max-width:400px;
    background:#020617;
    padding:20px;
    border-radius:12px;
}
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
}
button{
    width:100%;
    margin-top:15px;
    padding:12px;
    font-size:16px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
.chat{
    display:none;
}
.header{
    padding:12px;
    background:#020617;
    text-align:center;
    border-bottom:1px solid #1e293b;
}
.messages{
    flex:1;
    overflow-y:auto;
    padding:10px;
}
.msg{
    background:#1e293b;
    padding:8px;
    border-radius:8px;
    margin-bottom:8px;
}
.time{
    font-size:11px;
    color:#94a3b8;
    margin-top:4px;
}
.bottom{
    display:flex;
    padding:10px;
    gap:6px;
}
.bottom input{
    flex:1;
}
.bottom button{
    width:80px;
}
</style>
</head>

<body>

<div class="login" id="login">
    <div class="box">
        <h3>🔥 Vortex Chat</h3>
        <input id="name" placeholder="اسم خودتو بزن">
        <button onclick="enterChat()">ورود</button>
    </div>
</div>

<div class="chat" id="chat">
    <div class="header" id="welcome"></div>
    <div class="messages" id="messages"></div>
    <div class="bottom">
        <input id="text" placeholder="پیام خود را بنویسید">
        <button onclick="sendMsg()">ارسال</button>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyARn3TEjsJerSvRonQNesFbbWzfMN2RZhw",
  authDomain: "vortex-chat-d8cbe.firebaseapp.com",
  databaseURL: "https://vortex-chat-d8cbe-default-rtdb.firebaseio.com",
  projectId: "vortex-chat-d8cbe",
  storageBucket: "vortex-chat-d8cbe.appspot.com",
  messagingSenderId: "1084525595828",
  appId: "1:1084525595828:web:auto"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username = "";

function enterChat(){
    const n = document.getElementById("name").value.trim();
    if(!n) return alert("اسم وارد کن");
    username = n;
    document.getElementById("login").style.display="none";
    document.getElementById("chat").style.display="flex";
    document.getElementById("welcome").innerText = "خوش آمدی " + username;
}

function sendMsg(){
    const txt = document.getElementById("text");
    if(txt.value==="") return;

    db.ref("messages").push({
        name: username,
        text: txt.value,
        time: new Date().toLocaleTimeString()
    });

    txt.value="";
}

db.ref("messages").on("child_added", snap=>{
    const d = snap.val();
    const div = document.createElement("div");
    div.className="msg";
    div.innerHTML = `<b>${d.name}</b><br>${d.text}<div class="time">${d.time}</div>`;
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = 999999;
});
</script>

</body>
  </html>
